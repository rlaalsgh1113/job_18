<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Job Scrapper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <h1>Job Scrapper</h1>
        <p>인크루트 + 사람인 채용공고를 한 번에 검색합니다.</p>
        <form action="/search" method="get">
            <input type="text" name="keyword" placeholder="검색어를 입력하세요 (예: python)" required>
            <button type="submit">검색</button>
        </form>
    </main>
</body>
</html>
